# ─────────────────────────────────────────────────────────
# Deploy the static site to GitHub Pages (gh-pages branch)
#
# Triggered on push to main or manual workflow_dispatch.
# There is no build: `site/` is published as committed, after
# the checks in scripts/ pass. Nothing is installed — the
# checks run on the Node.js that ships with the runner.
#
# GitHub Pages must be set to "Deploy from a branch: gh-pages /".
# Custom domain: code.wus-technik.com (site/CNAME).
# ─────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-deploy:
    name: Check & Deploy
    runs-on: ubuntu-24.04

    steps:
      # 1. Check out source
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Assertions on site/ and the scroll-spy unit tests
      - name: Check site
        run: |
          node --version
          node --test scripts/test-spy.mjs
          node scripts/check-site.mjs

      # 3. Publish site/ to the gh-pages branch
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true
